name: QEMU Hexagon Build and Test

on:
  push:
    paths:
      - 'target/hexagon/**'
      - 'tests/tcg/hexagon/**'
      - 'tests/functional/hexagon/**'
      - 'hw/hexagon/**'
      - '.github/workflows/test-hex.yml'
  pull_request:
    paths:
      - 'target/hexagon/**'
      - 'tests/tcg/hexagon/**'
      - 'tests/functional/hexagon/**'
      - 'hw/hexagon/**'
      - '.github/workflows/test-hex.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Hexagon (${{ matrix.os }}${{ matrix.label && format(', {0}', matrix.label) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04 }
          - { os: ubuntu-24.04 }
          - { os: ubuntu-24.04, extra_configure: --disable-hexagon-idef-parser, label: no-idef-parser }
          - { os: ubuntu-24.04, extra_configure: --enable-debug --enable-debug-tcg --enable-ubsan, compiler: clang, label: debug }
          - { os: ubuntu-24.04-arm }
          - { os: macOS-15 }
          - { os: macOS-26 }
          - { os: windows-latest,  sys: ucrt64,     pkg_prefix: mingw-w64-ucrt-x86_64 }
          - { os: windows-11-arm,  sys: clangarm64, pkg_prefix: mingw-w64-clang-aarch64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            libfdt-dev \
            zlib1g-dev \
            flex \
            bison \
            python3-pip \
            python3-venv

      - name: Install clang
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang
          CLANG_VER=$(clang --version | head -1 | grep -oP '(?<=clang version )[0-9]+')
          sudo apt-get install -y libclang-rt-${CLANG_VER}-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            ninja \
            pkg-config \
            glib \
            pixman \
            dtc \
            flex \
            bison \
            python3
          # bison and flex are keg-only on macOS; prepend to PATH so meson
          # finds the Homebrew versions instead of the stale system ones.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >-
            base-devel
            git
            ${{ matrix.pkg_prefix }}-toolchain
            ${{ matrix.pkg_prefix }}-ninja
            ${{ matrix.pkg_prefix }}-pkg-config
            ${{ matrix.pkg_prefix }}-glib2
            ${{ matrix.pkg_prefix }}-pixman
            ${{ matrix.pkg_prefix }}-dtc
            ${{ matrix.pkg_prefix }}-python
            flex
            bison

      - name: Install Rust via rustup (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install bindgen-cli

      - name: Configure and Build (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || '' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || '' }}
        run: |
          mkdir build
          cd build
          ../configure \
            --disable-capstone \
            --disable-tools \
            --disable-guest-agent \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-install-blobs \
            $(test "$RUNNER_OS" = "Linux" && echo --enable-rust) \
            $(test "$RUNNER_OS" = "Linux" && echo --enable-containers) \
            --enable-download \
            ${{ matrix.extra_configure }} \
            --target-list=$(test "$RUNNER_OS" = "Linux" && echo hexagon-linux-user,)hexagon-softmmu
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          ../configure \
            --disable-capstone \
            --disable-tools \
            --disable-guest-agent \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-install-blobs \
            --enable-download \
            --target-list=hexagon-softmmu
          make -j$(nproc)

      - name: Test check-tcg (Linux/macOS)
        if: runner.os != 'Windows'
        run: make -C build check-tcg -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Test check-tcg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C build check-tcg -j$(nproc)

      # check covers check-qtest, check-functional, check-unit, and more.
      # SPEED=thorough is required to include tests in the thorough suite.
      # check is not supported on Windows in this configuration.
      - name: Test check
        if: runner.os != 'Windows'
        run: make -C build check SPEED=thorough -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}${{ matrix.label && format('-{0}', matrix.label) || '' }}
          path: |
            build/meson-logs/testlog.txt
            build/tests/functional/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  build-wasm64:
    name: Build Hexagon (wasm64, emcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Cross-builds the wasm64-emscripten host config, exercising the
    # idef-parser preprocessing step under emcc (compiler id "emscripten",
    # not an invocable program -- see target/hexagon/meson.build use of
    # cmd_array() instead of get_id()). wasm64 has no linux-user host
    # support, so this only builds hexagon-softmmu, and there is no way to
    # execute the resulting binary in this job, so this only verifies that
    # the build succeeds.
    #
    # Runs inside the same container image used by the project's own
    # build-wasm64-64bit/-32bit GitLab CI jobs (built from
    # .gitlab-ci.d/dockerfiles/emsdk-wasm64-cross.docker), rather than
    # rebuilding zlib/libffi/pixman/glib from source here. That avoids
    # pinned-version/upstream-URL drift (e.g. zlib.net reshuffling old
    # releases) and guarantees the same emcc/libtool/dependency versions
    # the GitLab pipeline already validates.
    container:
      image: registry.gitlab.com/qemu-project/qemu/qemu/emsdk-wasm64-cross:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install missing build tools
        run: |
          apt-get update
          apt-get install -y flex bison

      - name: Configure and build QEMU (wasm64)
        env:
          # target/hexagon/meson.build builds a native (build-machine)
          # idef-parser helper that depends on glib-2.0. Meson resolves
          # native dependencies via PKG_CONFIG_PATH_FOR_BUILD, not the
          # plain PKG_CONFIG_PATH baked into this image (which points
          # pkg-config at the wasm64-built glib for the host/cross side).
          # Without this, the native lookup finds nothing and configure
          # fails even though a native libglib2.0-dev is installed.
          PKG_CONFIG_PATH_FOR_BUILD: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          mkdir build
          cd build
          emconfigure ../configure \
            --disable-docs \
            --static \
            --cpu=wasm64 \
            --disable-tools \
            --enable-debug \
            --enable-tcg-interpreter \
            --target-list=hexagon-softmmu
          emmake make -j"$(nproc)"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-wasm64
          path: |
            build/config.log
            build/meson-logs/meson-log.txt
          if-no-files-found: ignore
          retention-days: 7
